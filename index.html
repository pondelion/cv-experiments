<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cv-experiments デモ</title>
  <meta name="description" content="cv-experiments で学習したモデルを、ブラウザの中だけで動かすデモ">
  <link rel="stylesheet" href="site/style.css">
  <script>
    // WASM(CPU)を複数のスレッドで動かすため、coi-sw.js(COOP・COEP のヘッダーを足す service worker)を使う。
    // 初めて開いたときは、service worker が効くように 1 回だけ読み込み直す(何度も読み込み直さないよう sessionStorage に印を残す)
    if (!window.crossOriginIsolated && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("coi-sw.js").then(() => {
        if (!sessionStorage.getItem("coi-reloaded")) {
          sessionStorage.setItem("coi-reloaded", "1");
          location.reload();
        }
      });
    }
  </script>
</head>
<body>
  <header class="topbar">
    <span class="brand">cv-experiments デモ</span>
    <a id="repo" class="muted small" href="#">リポジトリ</a>
  </header>
  <main class="main">
    <p id="description" class="muted"></p>

    <section class="panel controls">
      <label>タスク <select id="task"></select></label>
      <label>モデル <select id="model"></select></label>
      <label>実行の場所
        <select id="backend">
          <option value="auto">自動(WebGPU → WASM)</option>
          <option value="webgpu">WebGPU</option>
          <option value="wasm">WASM(CPU)</option>
        </select>
      </label>
      <label>スコアの閾値 <input id="threshold" type="range" min="0.05" max="0.95" step="0.05"> <span id="threshold-value"></span></label>
      <p id="model-info" class="muted small"></p>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" data-source="youtube" role="tab">YouTube</button>
        <button class="tab" data-source="file" role="tab">手元の動画・画像</button>
        <button class="tab" data-source="camera" role="tab">カメラ</button>
      </div>
      <div class="source" data-source="youtube">
        <div class="row">
          <input id="yt-url" type="url" value="https://www.youtube.com/watch?v=Yrqu7-UHtDM" placeholder="YouTube の URL(例: https://www.youtube.com/watch?v=...)">
          <button id="yt-load">埋め込む</button>
        </div>
        <p class="muted small">
          動画は YouTube の公式の埋め込みで再生し、このタブの画面を埋め込みの部分だけ取り込んで推論します(動画のファイルは取ってきません)。
          PC 版の Chrome・Edge だけで動きます。「推論を始める」を押すと共有の確認が出るので、「このタブ」を選んでください。
          結果は埋め込みに重ねず、右に並べて表示します(重ねると、描いた結果も取り込まれてしまうため)。
        </p>
      </div>
      <div class="source" data-source="file" hidden>
        <input id="file" type="file" accept="video/*,image/*">
        <p class="muted small">動画は繰り返し再生しながら推論し、画像は 1 回だけ推論します(画像はスコアの閾値を変えると描き直します)。</p>
      </div>
      <div class="source" data-source="camera" hidden>
        <p class="muted small">「推論を始める」を押すと、カメラの使用の確認が出ます。</p>
      </div>
      <div class="row">
        <button id="start" class="primary">推論を始める</button>
        <button id="stop" disabled>止める</button>
        <span id="status" class="muted small"></span>
      </div>
    </section>

    <section class="stage">
      <figure>
        <figcaption class="muted small">入力</figcaption>
        <div id="input-view" class="view"></div>
      </figure>
      <figure>
        <figcaption class="muted small">結果 <span id="fps"></span></figcaption>
        <div class="view"><canvas id="output"></canvas></div>
      </figure>
    </section>
  </main>
  <script type="module" src="site/app.js"></script>
</body>
</html>
